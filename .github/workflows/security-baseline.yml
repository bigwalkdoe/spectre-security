name: Security Baseline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  security-baseline:
    name: Security Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Gitleaks
      
      - name: Set up Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          ignore-unfixed: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
      
      - name: Set up Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: 'detect --source . --no-banner --config .gitleaks.toml --report-format sarif --report-path gitleaks-results.sarif'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Gitleaks results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'gitleaks-results.sarif'
          category: 'gitleaks'
      
      - name: Run OPA Policy Validation
        if: hashFiles('security/opa/policies/*.rego') != ''
        run: |
          curl -L -o opa https://github.com/open-policy-agent/opa/releases/download/v0.67.0/opa_linux_amd64_static
          chmod +x opa
          for policy in security/opa/policies/*.rego; do
            echo "Validating $policy..."
            ./opa check "$policy" || exit 1
          done
      
      - name: Run Security Hardening Checks
        run: |
          chmod +x security/run-security-hardening.sh
          ./security/run-security-hardening.sh
      
      - name: Run AIDE File Integrity Check
        run: |
          chmod +x security/check-file-integrity-local.sh
          ./security/check-file-integrity-local.sh
      
      - name: Wazuh Status Check
        run: |
          chmod +x security/check-wazuh-status.sh
          ./security/check-wazuh-status.sh || true  # Non-blocking
      
      - name: Run Baseline Runner (Full)
        run: |
          chmod +x security/baseline-runner.sh
          ./security/baseline-runner.sh
      
      - name: Generate SBOM
        run: |
          chmod +x security/generate-sbom.sh
          ./security/generate-sbom.sh
      
      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-artifacts
          path: security/logs/sbom-*/
          retention-days: 90
      
      - name: Upload Baseline Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-baseline-logs
          path: security/logs/
          retention-days: 30

  drift-detection:
    name: Infrastructure Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Run Drift Detection
        run: |
          chmod +x security/drift-detection.sh
          ./security/drift-detection.sh
        continue-on-error: true  # Don't fail build, just report
      
      - name: Upload Drift Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: security/logs/drift-report-*
          retention-days: 30
      
      - name: Comment on PR with Drift Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const logsDir = 'security/logs';
            const files = fs.readdirSync(logsDir).filter(f => f.startsWith('drift-report-') && f.endsWith('.json'));
            if (files.length > 0) {
              const latest = files.sort().reverse()[0];
              const report = JSON.parse(fs.readFileSync(path.join(logsDir, latest), 'utf8'));
              const driftCount = Object.values(report.categories || {}).flatMap(c => Object.keys(c)).length;
              const driftDetected = report.drift_detected;
              
              let body = `## 🔍 Infrastructure Drift Detection\n\n`;
              body += `**Status:** ${driftDetected ? '⚠️ Drift Detected' : '✅ No Drift'}\n`;
              body += `**Issues Found:** ${driftCount}\n\n`;
              
              if (driftDetected) {
                body += `### Details\n`;
                for (const [category, checks] of Object.entries(report.categories)) {
                  body += `\n#### ${category}\n`;
                  for (const [check, details] of Object.entries(checks)) {
                    body += `- **${check}**: ${details.status} (expected: ${details.expected}, actual: ${details.actual})\n`;
                  }
                }
                body += `\n> Run \`./security/drift-detection.sh\` locally for full details.`;
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  docker-image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and scan Docker images
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: '${{ secrets.DOCKERHUB_USERNAME }}/scripts:latest'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: 'high'