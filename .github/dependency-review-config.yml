# Dependency Review Configuration
# Fail on high severity vulnerabilities in dependencies

fail-on-severity: high
allow-ghsas:
  # Add any GHSA IDs to allowlist here if needed
  # - GHSA-xxxx-xxxx-xxxx

# Package ecosystems to scan
package-ecosystems:
  - npm
  - python
  - go
  - docker

# Severity thresholds
severity-thresholds:
  critical: 0
  high: 0
  medium: 5
  low: 10